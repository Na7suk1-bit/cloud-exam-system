mutation CreateUser($username: String!, $email: String!) @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", username: $username, email: $email})
}

mutation CreateQuiz($title: String!, $category: String!, $description: String, $isPublic: Boolean) @auth(level: USER) {
  quiz_insert(data: {title: $title, category: $category, description: $description, isPublic: $isPublic, creatorId_expr: "auth.uid"})
}

mutation CreateQuestion($quizId: UUID!, $text: String!, $correctAnswer: String!, $options: String!, $pointValue: Int) @auth(level: USER) {
  question_insert(data: {quizId: $quizId, text: $text, correctAnswer: $correctAnswer, options: $options, pointValue: $pointValue})
}

mutation CreateAttempt($quizId: UUID!, $score: Int!) @auth(level: USER) {
  attempt_insert(data: {quizId: $quizId, userId_expr: "auth.uid", score: $score})
}

mutation CreateFavorite($quizId: UUID!) @auth(level: USER) {
  favorite_insert(data: {quizId: $quizId, userId_expr: "auth.uid"})
}

mutation UpdateUser($username: String, $email: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {username: $username, email: $email})
}

mutation UpdateQuiz($id: UUID!, $title: String) @auth(level: USER) {
  quiz_update(key: {id: $id}, data: {title: $title})
}

mutation DeleteFavorite($quizId: UUID!) @auth(level: USER) {
  favorite_deleteMany(where: {quizId: {eq: $quizId}, userId: {eq_expr: "auth.uid"}})
}

mutation DeleteQuiz($id: UUID!) @auth(level: USER) {
  quiz_delete(key: {id: $id})
}

query GetMyUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    username
    email
  }
}

query ListPublicQuizzes @auth(level: PUBLIC, insecureReason: "Publicly accessible content for discovery.") {
  quizzes(where: {isPublic: {eq: true}}) {
    id
    title
    category
  }
}

query ListMyAttempts @auth(level: USER) {
  attempts(where: {userId: {eq_expr: "auth.uid"}}) {
    score
    quiz {
      title
    }
  }
}

query GetQuizDetails($id: UUID!) @auth(level: PUBLIC, insecureReason: "Allowing users to view public quiz details.") {
  quiz(id: $id) {
    title
    description
    questions_on_quiz {
      text
      options
    }
  }
}